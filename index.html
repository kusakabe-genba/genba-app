<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>現場予定表アプリ（カレンダー版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function ScheduleApp() {
      const [plans, setPlans] = useState(() => {
        const saved = localStorage.getItem("plans");
        return saved ? JSON.parse(saved) : [];
      });

      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState("");
      const [site, setSite] = useState("");

      useEffect(() => {
        localStorage.setItem("plans", JSON.stringify(plans));
      }, [plans]);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const days = getDaysInMonth(year, month);

      function formatDate(day) {
        return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function addPlan() {
        if (!selectedDate || !site) return alert("日付と現場名入れて");
        setPlans([{ date: selectedDate, site }, ...plans]);
        setSite("");
      }

      function getPlansByDate(date) {
        return plans.filter((p) => p.date === date);
      }

      function changeMonth(diff) {
        const d = new Date(currentDate);
        d.setMonth(d.getMonth() + diff);
        setCurrentDate(d);
      }

      return (
        <div className="p-4 max-w-5xl mx-auto">
          <div className="flex justify-between items-center mb-4">
            <button onClick={() => changeMonth(-1)}>◀</button>
            <h1 className="text-xl font-bold">{year}年 {month + 1}月</h1>
            <button onClick={() => changeMonth(1)}>▶</button>
          </div>

          <div className="grid grid-cols-7 gap-2 text-center text-sm">
            {["日","月","火","水","木","金","土"].map(d => <div key={d}>{d}</div>)}

            {Array.from({ length: days }).map((_, i) => {
              const day = i + 1;
              const dateStr = formatDate(day);
              const dayPlans = getPlansByDate(dateStr);

              return (
                <div
                  key={day}
                  onClick={() => setSelectedDate(dateStr)}
                  className="border rounded p-2 cursor-pointer bg-white hover:bg-blue-50"
                >
                  <div className="font-bold">{day}</div>
                  {dayPlans.map((p, idx) => (
                    <div key={idx} className="text-xs truncate">{p.site}</div>
                  ))}
                </div>
              );
            })}
          </div>

          <div className="mt-6 bg-white p-4 rounded shadow">
            <div className="mb-2 font-bold">予定登録</div>
            <div className="flex gap-2">
              <input value={selectedDate} readOnly className="border p-2" />
              <input value={site} onChange={(e)=>setSite(e.target.value)} placeholder="現場名" className="border p-2 flex-1" />
              <button onClick={addPlan} className="bg-black text-white px-4">追加</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ScheduleApp />);
  </script>
</body>
</html>
