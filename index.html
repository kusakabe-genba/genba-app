<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>現場予定表アプリ（完全版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const defaultMembers = ["社長","班長","山田","田中"];
const defaultWorkTypes = ["舗装工","路盤工","掘削","埋戻し"];
const statuses = ["予定","変更","確定","中止"];

function App(){

  const [plans,setPlans] = useState(()=>{
    const saved = localStorage.getItem("plans_v2");
    return saved?JSON.parse(saved):[];
  });

  const [members,setMembers] = useState(()=>{
    const saved = localStorage.getItem("members_v2");
    return saved?JSON.parse(saved):defaultMembers;
  });

  const [workTypes,setWorkTypes] = useState(()=>{
    const saved = localStorage.getItem("types_v2");
    return saved?JSON.parse(saved):defaultWorkTypes;
  });

  const [date,setDate]=useState("");
  const [site,setSite]=useState("");
  const [leader,setLeader]=useState(members[0]);
  const [workType,setWorkType]=useState(workTypes[0]);
  const [status,setStatus]=useState("予定");

  useEffect(()=>{
    localStorage.setItem("plans_v2",JSON.stringify(plans));
  },[plans]);

  useEffect(()=>{
    localStorage.setItem("members_v2",JSON.stringify(members));
  },[members]);

  useEffect(()=>{
    localStorage.setItem("types_v2",JSON.stringify(workTypes));
  },[workTypes]);

  function addPlan(){
    if(!date||!site)return alert("日付と現場入れて");
    setPlans([{id:Date.now(),date,site,leader,workType,status},...plans]);
  }

  function removePlan(id){
    setPlans(plans.filter(p=>p.id!==id));
  }

  function nextStatus(id){
    setPlans(plans.map(p=>{
      if(p.id!==id)return p;
      const i=statuses.indexOf(p.status);
      return {...p,status:statuses[(i+1)%statuses.length]};
    }))
  }

  function getColor(s){
    if(s==="確定")return "bg-green-200";
    if(s==="変更")return "bg-yellow-200";
    if(s==="中止")return "bg-red-200";
    return "bg-gray-100";
  }

  function getDays(){
    const d=new Date();
    const y=d.getFullYear();
    const m=d.getMonth();
    const last=new Date(y,m+1,0).getDate();
    return Array.from({length:last},(_,i)=>i+1);
  }

  function format(day){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  return (
  <div className="p-4 max-w-6xl mx-auto space-y-4">

    <h1 className="text-2xl font-bold">現場予定表（完全版）</h1>

    {/* カレンダー */}
    <div className="grid grid-cols-7 gap-2">
      {getDays().map(day=>{
        const d=format(day);
        const list=plans.filter(p=>p.date===d);
        return (
          <div key={day} onClick={()=>setDate(d)} className="bg-white p-2 rounded border cursor-pointer">
            <div className="font-bold">{day}</div>
            {list.map(p=>(
              <div key={p.id} className={`text-xs ${getColor(p.status)}`}>
                {p.site}
              </div>
            ))}
          </div>
        )
      })}
    </div>

    {/* 登録 */}
    <div className="bg-white p-4 rounded shadow space-y-2">
      <input value={date} readOnly className="border p-2 w-full" />
      <input value={site} onChange={e=>setSite(e.target.value)} placeholder="現場" className="border p-2 w-full" />

      <select value={leader} onChange={e=>setLeader(e.target.value)} className="border p-2 w-full">
        {members.map(m=><option key={m}>{m}</option>)}
      </select>

      <select value={workType} onChange={e=>setWorkType(e.target.value)} className="border p-2 w-full">
        {workTypes.map(w=><option key={w}>{w}</option>)}
      </select>

      <button onClick={addPlan} className="bg-black text-white w-full p-2">追加</button>
    </div>

    {/* 一覧 */}
    <div className="space-y-2">
      {plans.map(p=>(
        <div key={p.id} className="bg-white p-3 rounded shadow flex justify-between items-center">
          <div>
            <div>{p.date} {p.site}</div>
            <div className="text-sm text-gray-500">{p.workType} / {p.leader}</div>
          </div>
          <div className="flex gap-2">
            <button onClick={()=>nextStatus(p.id)} className="text-xs">状態</button>
            <button onClick={()=>removePlan(p.id)} className="text-xs text-red-500">削除</button>
          </div>
        </div>
      ))}
    </div>

  </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
